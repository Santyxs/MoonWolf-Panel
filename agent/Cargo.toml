[package]
name = "moonwolf-agent"
version = "0.1.0"
edition = "2024"
description = "MoonWolf Agent"
authors = ["Santyxs"]
license = "MIT"
repository = "https://github.com/Santyxs/MoonWolf-Panel"
build = "build.rs"

[[bin]]
name = "moonwolf-agent"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao", "dep:muda", "dep:tray-icon", "dep:image"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "io-util", "process", "signal"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures = "0.3"

axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }

mysql_async = { version = "0.35", default-features = false, features = ["default-rustls"] }

rust_socketio = { version = "0.6", features = ["async"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22"
rand = "0.8"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

walkdir = "2"

chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

wry = { version = "0.45", optional = true }
tao = { version = "0.30", optional = true }
muda = { version = "0.15", optional = true }
tray-icon = { version = "0.19", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
