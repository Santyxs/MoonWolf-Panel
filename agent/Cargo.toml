[package]
name = "moonwolf-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "MoonWolf Agent"
authors = ["Santyxs"]
license = "MIT"
repository = "https://github.com/Santyxs/MoonWolf-Panel"

[features]
default = ["gui"]
gui = ["dep:slint"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
bytes = "1"
futures-util = "0.3"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "gzip"] }
rust_socketio = { version = "0.6", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "io-util", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
webrtc = "0.21.1"
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "image-default-formats", "system-tray"], optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[build-dependencies]
slint-build = "1.18"
