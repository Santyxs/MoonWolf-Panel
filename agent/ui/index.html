<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonWolf Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 20px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #ffffff, #58a6ff);
    box-shadow: 0 0 20px rgba(88,166,255,.4);
    flex-shrink: 0;
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 13px; color: #8b949e; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .status-row { display: flex; align-items: center; gap: 12px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #d29922; flex-shrink: 0;
  }
  .dot.on { background: #3fb950; }
  .dot.off { background: #f85149; }
  .label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; color: #8b949e; margin-bottom: 2px;
  }
  .value {
    font-size: 14px; word-break: break-all;
  }
  .row {
    display: flex; justify-content: space-between;
    align-items: center; gap: 10px; padding: 8px 0;
  }
  .row + .row { border-top: 1px solid #21262d; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    border: 1px solid #30363d; border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
    background: #21262d; color: #e6edf3;
  }
  button:hover { background: #30363d; }
  button.primary {
    background: #238636; border-color: #238636; color: #fff;
  }
  button.primary:hover { background: #2ea043; }
  button.danger {
    background: #21262d; border-color: #f85149; color: #f85149;
  }
  .actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-top: 4px;
  }
  .logs {
    max-height: 140px; overflow-y: auto;
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px; line-height: 1.4; color: #8b949e;
  }
  .logs .e { color: #f85149; }
  .logs .w { color: #d29922; }
  .logs .i { color: #c9d1d9; }
  .foot {
    text-align: center; font-size: 11px; color: #484f58;
    margin-top: 16px;
  }
  #pairing { font-weight: 600; font-size: 16px; letter-spacing: .05em; color: #58a6ff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo"></div>
    <div>
      <h1>MoonWolf Agent</h1>
      <p>Cliente nativo · Rust</p>
    </div>
  </div>

  <div class="card status-row">
    <div id="dot" class="dot"></div>
    <div>
      <div id="statusTitle" style="font-weight:600">Conectando…</div>
      <div id="statusDesc" style="font-size:12px;color:#8b949e">Iniciando</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="label">Código de emparejamiento</div>
        <div id="pairing" class="value">—</div>
      </div>
      <button type="button" id="btnCopy">Copiar</button>
    </div>
    <div class="row">
      <div style="min-width:0">
        <div class="label">Carpeta del servidor</div>
        <div id="serverDir" class="value">—</div>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="label">Versión</div>
        <div id="version" class="value">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span id="localDot" class="dot" style="width:8px;height:8px"></span>
        <span style="font-size:12px;color:#8b949e">API local</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:6px">Logs</div>
    <div id="logs" class="logs">Esperando eventos…</div>
  </div>

  <div class="actions">
    <button type="button" class="primary" id="btnPanel">Abrir Panel</button>
    <button type="button" id="btnConfig">Configuración</button>
    <button type="button" id="btnUpdate">Buscar updates</button>
    <button type="button" class="danger" id="btnQuit">Salir</button>
  </div>

  <div class="foot">MoonWolf · sin Node.js</div>
</div>

<script>
(function () {
  function send(obj) {
    var msg = typeof obj === 'string' ? obj : JSON.stringify(obj);
    try {
      if (window.ipc && typeof window.ipc.postMessage === 'function') {
        window.ipc.postMessage(msg);
        return;
      }
    } catch (e) {}
    try {
      if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
        window.chrome.webview.postMessage(msg);
        return;
      }
    } catch (e) {}
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ipc) {
        window.webkit.messageHandlers.ipc.postMessage(msg);
        return;
      }
    } catch (e) {}
    console.warn('IPC no disponible', msg);
  }

  function $(id) { return document.getElementById(id); }

  function apply(state) {
    if (!state) return;
    var cloud = !!state.cloudConnected;
    var local = !!state.localServerReady;
    $('dot').className = 'dot ' + (cloud ? 'on' : 'off');
    $('statusTitle').textContent = cloud ? 'Conectado' : 'Desconectado';
    $('statusDesc').textContent = cloud ? 'MoonWolf Cloud' : 'Reintentando conexión…';
    $('pairing').textContent = state.pairingCode || '—';
    $('serverDir').textContent = state.serverDir || '—';
    $('version').textContent = state.version || '—';
    $('localDot').className = 'dot ' + (local ? 'on' : 'off');

    var logs = Array.isArray(state.logs) ? state.logs.slice(-15) : [];
    var el = $('logs');
    if (!logs.length) {
      el.textContent = 'Sin logs todavía';
      return;
    }
    el.innerHTML = logs.map(function (l) {
      var lvl = String(l.level || 'info').toLowerCase();
      var cls = lvl === 'error' ? 'e' : (lvl === 'warn' ? 'w' : 'i');
      var msg = String(l.message || '').replace(/</g, '&lt;');
      return '<div class="' + cls + '">[' + lvl + '] ' + msg + '</div>';
    }).join('');
    el.scrollTop = el.scrollHeight;
  }

  window.__applyState = function (json) {
    try {
      var state = typeof json === 'string' ? JSON.parse(json) : json;
      apply(state);
    } catch (e) {
      console.error(e);
    }
  };

  window.__moonwolfAgent = {
    post: send,
    onState: apply
  };

  $('btnCopy').onclick = function () {
    var t = $('pairing').textContent;
    if (t && t !== '—') {
      try { navigator.clipboard.writeText(t); } catch (e) {}
      send({ action: 'copy_pairing' });
    }
  };
  $('btnPanel').onclick = function () { send({ action: 'open_panel' }); };
  $('btnConfig').onclick = function () { send({ action: 'open_config_dir' }); };
  $('btnUpdate').onclick = function () { send({ action: 'check_update' }); };
  $('btnQuit').onclick = function () { send({ action: 'quit' }); };

  // Aviso visual de que el JS cargó
  $('statusDesc').textContent = 'UI lista · esperando estado del agent';
})();
</script>
</body>
</html>
