<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonWolf Agent</title>
  <style>
    :root { --bg:#0b1020; --card:#141b2d; --text:#e8eefc; --muted:#8b9bb8; --accent:#6c9eff; --ok:#3dd68c; --warn:#f5a524; --err:#f31260; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .app{max-width:560px;margin:0 auto;padding:1.5rem}
    .hero{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem}
    .moon{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#6c9eff);box-shadow:0 0 24px #6c9eff66}
    h1{margin:0;font-size:1.4rem} .hero p{margin:0;color:var(--muted);font-size:.9rem}
    .card{background:var(--card);border-radius:14px;padding:1rem 1.15rem;margin-bottom:.85rem}
    .status{display:flex;align-items:center;gap:.75rem}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--warn)}
    .dot.ok{background:var(--ok)} .dot.err{background:var(--err)}
    .label{font-size:.72rem;color:var(--muted);text-transform:uppercase}
    .value{font-size:.95rem;word-break:break-all}
    .row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.35rem 0}
    .sep{height:1px;background:#ffffff12;margin:.4rem 0}
    button{border:0;border-radius:10px;padding:.55rem 1rem;font-weight:600;cursor:pointer;background:#1e2a44;color:var(--text)}
    button.primary{background:var(--accent);color:#0b1020}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.5rem}
    .logs{max-height:160px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;line-height:1.35;color:var(--muted)}
    .logs .err{color:var(--err)} .logs .warn{color:var(--warn)} .logs .info{color:var(--text)}
    footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:1.5rem}
  </style>
</head>
<body>
  <div class="app">
    <div class="hero"><div class="moon"></div><div><h1>MoonWolf</h1><p>Agent · Rust</p></div></div>
    <div class="card status">
      <div id="dot" class="dot"></div>
      <div><strong id="status-title">Conectando…</strong><div id="status-desc" style="color:var(--muted);font-size:.85rem">Iniciando</div></div>
    </div>
    <div class="card">
      <div class="row"><div><div class="label">Código de emparejamiento</div><div id="pairing" class="value">—</div></div><button type="button" id="copy-pairing">Copiar</button></div>
      <div class="sep"></div>
      <div class="row"><div style="min-width:0"><div class="label">Servidor</div><div id="server-dir" class="value">—</div></div></div>
      <div class="sep"></div>
      <div class="row"><div><div class="label">Versión</div><div id="version" class="value">—</div></div>
        <div style="display:flex;align-items:center;gap:.4rem"><span id="local-dot" class="dot" style="width:8px;height:8px"></span><span style="font-size:.8rem;color:var(--muted)">Local</span></div></div>
    </div>
    <div class="card">
      <div class="label" style="margin-bottom:.4rem">Logs recientes</div>
      <div id="logs" class="logs">—</div>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="open-panel">Abrir Panel</button>
      <button type="button" id="open-config">Configuración</button>
      <button type="button" id="check-update">Buscar updates</button>
      <button type="button" id="quit">Salir</button>
    </div>
    <footer>MoonWolf Agent · sin Node.js</footer>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    function apply(state) {
      if (!state) return;
      const cloud = !!state.cloudConnected;
      const local = !!state.localServerReady;
      $('dot').className = 'dot ' + (cloud ? 'ok' : 'err');
      $('status-title').textContent = cloud ? 'Conectado' : 'Desconectado';
      $('status-desc').textContent = cloud ? 'MoonWolf Cloud' : 'Reintentando…';
      $('pairing').textContent = state.pairingCode || '—';
      $('server-dir').textContent = state.serverDir || '—';
      $('version').textContent = state.version || '—';
      $('local-dot').className = 'dot ' + (local ? 'ok' : '');
      const logs = Array.isArray(state.logs) ? state.logs.slice(-12) : [];
      const el = $('logs');
      if (!logs.length) { el.textContent = '—'; return; }
      el.innerHTML = logs.map(l => {
        const lvl = (l.level || 'info').toLowerCase();
        const msg = (l.message || '').replace(/</g,'&lt;');
        return '<div class="'+lvl+'">['+lvl+'] '+msg+'</div>';
      }).join('');
      el.scrollTop = el.scrollHeight;
    }
    window.__moonwolfAgent = {
      post: obj => { try { window.ipc.postMessage(JSON.stringify(obj)); } catch(e) {} },
      onState: apply,
    };
    window.addEventListener('moonwolf-state', e => apply(e.detail));
    $('copy-pairing').onclick = () => { const t = $('pairing').textContent; if (t && t !== '—') navigator.clipboard?.writeText(t); };
    $('open-panel').onclick = () => window.__moonwolfAgent.post({ action: 'open_panel' });
    $('open-config').onclick = () => window.__moonwolfAgent.post({ action: 'open_config_dir' });
    $('check-update').onclick = () => window.__moonwolfAgent.post({ action: 'check_update' });
    $('quit').onclick = () => window.__moonwolfAgent.post({ action: 'quit' });
  </script>
</body>
</html>
