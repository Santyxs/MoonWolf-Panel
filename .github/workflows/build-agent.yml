name: Build Agent

on:
  workflow_dispatch:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Agent dependencies
        working-directory: agent
        run: npm install --no-package-lock

      - name: Bundle Agent
        run: node build-agent.mjs

      - name: Build Windows executable
        run: node --build-sea sea-config.json

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'dist/MoonWolf-Agent.exe'
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $size = (Get-Item $exe).Length
          Write-Host "MoonWolf-Agent.exe: $size bytes"
          if ($size -lt 1MB) {
            throw 'El ejecutable generado es sospechosamente pequeño.'
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe
          if-no-files-found: error

      - name: Publish or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/MoonWolf-Agent.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/MoonWolf-Agent.exe \
              --title "MoonWolf Agent $GITHUB_REF_NAME" \
              --generate-notes
          fi
