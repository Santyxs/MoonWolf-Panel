```yaml
name: Build Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.9.0

      - name: Install Agent dependencies
        working-directory: agent
        run: npm install --no-package-lock

      - name: Prepare WebViewJS
        shell: pwsh
        run: |
          $file = "agent/node_modules/@webviewjs/webview/js-bindings.js"
          $content = Get-Content $file -Raw

          if (-not $content.Contains(
            "return require(process.env.NAPI_RS_NATIVE_LIBRARY_PATH);"
          )) {
            throw "No se encontró el cargador nativo de WebViewJS."
          }

          $content = $content.Replace(
            "return require(process.env.NAPI_RS_NATIVE_LIBRARY_PATH);",
            @"

      - name: Prepare build
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item dist -ItemType Directory -Force | Out-Null

          @'
          module.exports = {};
          '@ | Set-Content agent/webview-native-shim.js -Encoding utf8

      - name: Bundle Agent
        run: |
          npx esbuild agent/index.js `
            --bundle `
            --platform=node `
            --target=node24 `
            --format=cjs `
            --alias:@webviewjs/webview-win32-x64-msvc=./webview-native-shim.js `
            --outfile=dist/agent.cjs

      - name: Create SEA configuration
        shell: pwsh
        run: |
          $root = (Get-Location).Path

          @{
            main = "$root\dist\agent.cjs"
            mainFormat = "commonjs"
            output = "$root\dist\MoonWolf-Agent.exe"
            disableExperimentalSEAWarning = $true
            useSnapshot = $false
            useCodeCache = $false
            assets = @{
              "ui/index.html" = "$root\agent\ui\index.html"
              "ui/style.css" = "$root\agent\ui\style.css"
              "ui/app.js" = "$root\agent\ui\app.js"
              "native/webview.win32-x64-msvc.node" = "$root\agent\node_modules\@webviewjs\webview-win32-x64-msvc\webview.win32-x64-msvc.node"
            }
          } |
            ConvertTo-Json -Depth 10 |
            Set-Content dist/sea-config.json -Encoding utf8

      - name: Build Agent
        run: node --build-sea dist/sea-config.json

      - name: Hide console
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          $editbin = Get-ChildItem `
            "$vs" `
            -Filter editbin.exe `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $editbin) {
            throw "No se encontró editbin.exe."
          }

          & $editbin.FullName `
            /SUBSYSTEM:WINDOWS `
            "dist\MoonWolf-Agent.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe
          compression-level: 0

      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '
                [.[] |
                  select(
                    .isDraft == false and
                    .isPrerelease == false and
                    (.tagName | startswith("agent-v"))
                  ) |
                  .tagName |
                  capture("^agent-v(?<major>[0-9]+)\\.(?<minor>[0-9]+)$") |
                  {
                    major: (.major | tonumber),
                    minor: (.minor | tonumber)
                  }
                ] |
                sort_by(.major, .minor) |
                last |
                if . == null then
                  ""
                else
                  "agent-v\(.major).\(.minor)"
                end
              '
          )

          if [ -z "$latest" ]; then
            next="agent-v1.0"
          else
            version="${latest#agent-v}"
            major="${version%%.*}"
            minor="${version#*.}"
            next="agent-v${major}.$((minor + 1))"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" `
            dist/MoonWolf-Agent.exe `
            --title "MoonWolf Agent v${TAG_NAME#agent-v}" `
            --generate-notes
```
