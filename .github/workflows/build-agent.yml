name: Build Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'server.js'
      - '.github/workflows/build-agent.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Cache agent node_modules
        id: cache-agent-mods
        uses: actions/cache@v6
        with:
          path: agent/node_modules
          key: agent-mods-\( {{ runner.os }}- \){{ hashFiles('agent/package.json') }}

      - name: Install Agent dependencies
        if: steps.cache-agent-mods.outputs.cache-hit != 'true'
        working-directory: agent
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify native addons
        shell: pwsh
        run: |
          $natives = @(
            'agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node',
            'agent/node_modules/node-datachannel/build/Release/node_datachannel.node'
          )
          foreach ($p in $natives) {
            if (-not (Test-Path -LiteralPath $p)) {
              throw "Native addon not found: $p"
            }
            Write-Host "OK $(Resolve-Path -LiteralPath $p)"
          }

      - name: Patch natives for SEA + prepare dist
        shell: pwsh
        run: |
          # WebViewJS: process.dlopen via NAPI_RS_NATIVE_LIBRARY_PATH
          $bindings = 'agent/node_modules/@webviewjs/webview/js-bindings.js'
          if (-not (Test-Path -LiteralPath $bindings)) {
            throw "js-bindings.js not found"
          }
          $content = Get-Content -LiteralPath $bindings -Raw
          $old = 'return require(process.env.NAPI_RS_NATIVE_LIBRARY_PATH);'
          if ($content.Contains('process.dlopen(nativeModule, process.env.NAPI_RS_NATIVE_LIBRARY_PATH')) {
            Write-Host 'WebViewJS js-bindings already patched (cache hit).'
          } elseif ($content.Contains($old)) {
            $new = @(
              'const nativeModule = { exports: {} };'
              'process.dlopen(nativeModule, process.env.NAPI_RS_NATIVE_LIBRARY_PATH, 2);'
              'return nativeModule.exports;'
            ) -join "`n"
            Set-Content -LiteralPath $bindings -Value ($content.Replace($old, $new)) -Encoding utf8
            Write-Host 'WebViewJS js-bindings patched.'
          } else {
            throw 'Expected line not found in js-bindings.js.'
          }

          # Shim so esbuild does not load the .node binary
          $pkgDir = 'agent/node_modules/@webviewjs/webview-win32-x64-msvc'
          $shimRel = 'webview-shim.js'
          Set-Content -LiteralPath (Join-Path $pkgDir $shimRel) -Value 'module.exports = {};' -Encoding ascii -NoNewline
          $pkgJsonPath = Join-Path $pkgDir 'package.json'
          $pkg = Get-Content -LiteralPath $pkgJsonPath -Raw | ConvertFrom-Json
          $pkg.main = $shimRel
          $pkg | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $pkgJsonPath -Encoding utf8
          Write-Host "package.json main -> $shimRel"

          # node-datachannel: process.dlopen via NODE_DATACHANNEL_NATIVE_PATH
          $pattern = 'require\(\s*[''"][^''"]*node_datachannel\.node[''"]\s*\)'
          $replacement = '(() => { if (!process.env.NODE_DATACHANNEL_NATIVE_PATH) { throw new Error("NODE_DATACHANNEL_NATIVE_PATH is not defined"); } const m = { exports: {} }; process.dlopen(m, process.env.NODE_DATACHANNEL_NATIVE_PATH, 2); return m.exports; })()'
          $patched = 0
          Get-ChildItem -Path 'agent/node_modules/node-datachannel' -Recurse -Include '*.js','*.cjs','*.mjs' -File |
            ForEach-Object {
              $text = Get-Content -LiteralPath $_.FullName -Raw
              if ($text -match $pattern) {
                Set-Content -LiteralPath $_.FullName -Value ($text -replace $pattern, $replacement) -Encoding utf8 -NoNewline
                Write-Host "Patched: $($_.FullName)"
                $patched++
              }
            }
          if ($patched -eq 0) {
            $already = Get-ChildItem -Path 'agent/node_modules/node-datachannel' -Recurse -Include '*.js','*.cjs','*.mjs' -File |
              Where-Object { (Get-Content -LiteralPath $_.FullName -Raw) -match 'NODE_DATACHANNEL_NATIVE_PATH' }
            if ($already) {
              Write-Host "node-datachannel already patched (cache hit): $($already.Count) file(s)."
            } else {
              throw 'Native binding require not found in node-datachannel'
            }
          } else {
            Write-Host "node-datachannel: $patched file(s) patched."
          }

          if (Test-Path -LiteralPath 'dist') {
            Remove-Item -LiteralPath 'dist' -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null

      - name: Determine next Agent version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bump minor; at .99 roll over to next major.0
          latest=$(
            gh release list \
              --limit 50 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName \
              --jq '
                [.[] | .tagName | select(startswith("agent-v"))] |
                sort_by(sub("^agent-v"; "") | split(".") | map(tonumber)) |
                last // empty
              '
          )

          if [ -z "$latest" ]; then
            next="agent-v1.0"
          else
            version="${latest#agent-v}"
            major="${version%%.*}"
            minor="${version#*.}"
            minor=$((minor + 1))
            if [ "$minor" -ge 99 ]; then
              major=$((major + 1))
              minor=0
            fi
            -next="agent-v${major}.${minor}"
          fi

          echo "Latest version: ${latest:-none}"
          echo "Next version: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Bundle Agent
        shell: bash
        env:
          AGENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          npx --no-install esbuild agent/index.js \
            --bundle \
            --minify \
            --platform=node \
            --target=node26 \
            --format=cjs \
            --define:__AGENT_VERSION__="\"${AGENT_TAG#agent-v}\"" \
            --outfile=dist/agent.cjs \
            --log-level=info

          size=$(wc -c < dist/agent.cjs | tr -d ' ')
          echo "agent.cjs: ${size} bytes"
          if [ "$size" -lt 102400 ]; then
            echo "Generated bundle is suspiciously small." >&2
            exit 1
          fi

      - name: Create SEA configuration + build
        shell: pwsh
        run: |
          $native = (Resolve-Path 'agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node').Path
          $dcNative = (Resolve-Path 'agent/node_modules/node-datachannel/build/Release/node_datachannel.node').Path
          $main = (Resolve-Path 'dist/agent.cjs').Path
          $exe = Join-Path (Resolve-Path 'dist').Path 'MoonWolf-Agent.exe'
          $indexHtml = (Resolve-Path 'agent/ui/index.html').Path
          $styleCss = (Resolve-Path 'agent/ui/style.css').Path
          $appJs = (Resolve-Path 'agent/ui/app.js').Path

          $config = @{
            main = $main
            mainFormat = 'commonjs'
            output = $exe
            disableExperimentalSEAWarning = $true
            useSnapshot = $false
            useCodeCache = $true
            assets = @{
              'ui/index.html' = $indexHtml
              'ui/style.css' = $styleCss
              'ui/app.js' = $appJs
              'native/webview.win32-x64-msvc.node' = $native
              'native/node_datachannel.node' = $dcNative
            }
          }

          $config | ConvertTo-Json -Depth 10 | Set-Content -Path 'dist/sea-config.json' -Encoding utf8
          Write-Host 'sea-config.json:'
          Get-Content -LiteralPath 'dist/sea-config.json' -Raw

          if (Test-Path -LiteralPath $exe) { Remove-Item -LiteralPath $exe -Force }

          Write-Host 'Building SEA with node --build-sea...'
          node --build-sea (Resolve-Path 'dist/sea-config.json').Path
          if ($LASTEXITCODE -ne 0) { throw "node --build-sea exited with code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $exe)) { throw "Expected output not found: $exe" }

          $size = (Get-Item -LiteralPath $exe).Length
          Write-Host "MoonWolf-Agent.exe generated: $size bytes"
          if ($size -lt 1MB) { throw 'Generated executable is suspiciously small.' }

      - name: Restore rcedit cache
        uses: actions/cache@v6
        with:
          path: dist/tools/rcedit-x64.exe
          key: rcedit-x64-v2.0.0

      - name: Hide console + icon + metadata
        shell: pwsh
        env:
          AGENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $exe = (Resolve-Path 'dist/MoonWolf-Agent.exe').Path
          $version = $env:AGENT_TAG -replace '^agent-v', ''
          $fileVersion = "$version.0.0"
          $icon = (Resolve-Path 'agent/assets/MoonWolf-Agent.ico').Path

          # CONSOLE → WINDOWS (no console window)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }

          $vsInstallPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstallPath) -or -not (Test-Path -LiteralPath $vsInstallPath)) {
            throw 'Visual Studio installation with C++ tools not found.'
          }

          $msvcRoot = Join-Path $vsInstallPath 'VC\Tools\MSVC'
          $msvcVersion = Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          if ($null -eq $msvcVersion) { throw "No MSVC version found under $msvcRoot" }

          $editbin = Join-Path $msvcVersion.FullName 'bin\Hostx64\x64\editbin.exe'
          if (-not (Test-Path -LiteralPath $editbin)) { throw 'editbin.exe not found' }

          Write-Host "editbin MSVC $($msvcVersion.Name)"
          & $editbin /SUBSYSTEM:WINDOWS $exe
          if ($LASTEXITCODE -ne 0) { throw "editbin exited with code $LASTEXITCODE" }

          # Icon + version metadata
          $toolsDir = Join-Path (Resolve-Path 'dist').Path 'tools'
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          $rcedit = Join-Path $toolsDir 'rcedit-x64.exe'
          $rceditUrl = 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe'

          if (-not (Test-Path -LiteralPath $rcedit)) {
            Write-Host 'Downloading rcedit...'
            Invoke-WebRequest -Uri $rceditUrl -OutFile $rcedit -UseBasicParsing
          }
          if (-not (Test-Path -LiteralPath $rcedit)) { throw 'Failed to obtain rcedit-x64.exe' }

          & $rcedit $exe `
            --set-icon $icon `
            --set-version-string 'FileDescription' 'MoonWolf Agent' `
            --set-version-string 'ProductName' 'MoonWolf Agent' `
            --set-version-string 'InternalName' 'MoonWolf-Agent.exe' `
            --set-version-string 'OriginalFilename' 'MoonWolf-Agent.exe' `
            --set-version-string 'CompanyName' 'MoonWolf' `
            --set-file-version $fileVersion `
            --set-product-version $fileVersion
          if ($LASTEXITCODE -ne 0) { throw "rcedit exited with code $LASTEXITCODE" }

          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "FileDescription: $($info.FileDescription)"
          Write-Host "ProductName: $($info.ProductName)"
          Write-Host "FileVersion: $($info.FileVersion)"
          if ($info.FileDescription -ne 'MoonWolf Agent' -or $info.ProductName -ne 'MoonWolf Agent') {
            throw 'Metadata does not contain the expected name MoonWolf Agent.'
          }

          $size = (Get-Item -LiteralPath $exe).Length
          Write-Host "MoonWolf-Agent.exe ready: $size bytes"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe
          if-no-files-found: error

      - name: Create Agent tag + Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

          gh release create "$TAG_NAME" \
            dist/MoonWolf-Agent.exe \
            --title "MoonWolf Agent v${TAG_NAME#agent-v}" \
            --generate-notes
