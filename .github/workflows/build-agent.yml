name: Build Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.9.0

      - name: Show Node version
        run: node --version

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Install Agent dependencies
        working-directory: agent
        run: npm install --no-package-lock

      - name: Verify WebViewJS
        shell: pwsh
        run: |
          Write-Host "WebViewJS:"
          npm --prefix agent list @webviewjs/webview --depth=0

          $native = "agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node"

          if (-not (Test-Path -LiteralPath $native)) {
            throw "No se encontró el addon nativo de WebViewJS: $native"
          }

          Write-Host "Addon nativo encontrado:"
          Write-Host (Resolve-Path -LiteralPath $native)

      - name: Prepare Agent build directory
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "dist") {
            Remove-Item -LiteralPath "dist" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

      - name: Create WebViewJS native shim
        shell: pwsh
        run: |
          @'
          module.exports = {};
          '@ | Set-Content `
            -Path "agent/webview-native-shim.js" `
            -Encoding utf8

      - name: Bundle Agent with esbuild
        shell: pwsh
        run: |
          npx esbuild agent/index.js `
            --bundle `
            --platform=node `
            --target=node24 `
            --format=cjs `
            --alias:@webviewjs/webview-win32-x64-msvc=./webview-native-shim.js `
            --outfile=dist/agent.cjs `
            --log-level=info

          if ($LASTEXITCODE -ne 0) {
            throw "esbuild terminó con código $LASTEXITCODE"
          }

      - name: Verify Agent bundle
        shell: pwsh
        run: |
          $bundle = "dist/agent.cjs"

          if (-not (Test-Path -LiteralPath $bundle)) {
            throw "No se generó $bundle"
          }

          $size = (Get-Item -LiteralPath $bundle).Length

          Write-Host "agent.cjs: $size bytes"

          if ($size -lt 100KB) {
            throw "El bundle generado es sospechosamente pequeño."
          }

      - name: Create Node SEA configuration
        shell: pwsh
        run: |
          $native = (Resolve-Path `
            "agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node").Path

          $main = (Resolve-Path `
            "dist/agent.cjs").Path

          $output = Join-Path `
            (Resolve-Path "dist").Path `
            "MoonWolf-Agent.exe"

          $indexHtml = (Resolve-Path `
            "agent/ui/index.html").Path

          $styleCss = (Resolve-Path `
            "agent/ui/style.css").Path

          $appJs = (Resolve-Path `
            "agent/ui/app.js").Path

          $config = @{
            main = $main
            mainFormat = "commonjs"
            output = $output

            disableExperimentalSEAWarning = $true

            useSnapshot = $false
            useCodeCache = $false

            assets = @{
              "ui/index.html" = $indexHtml
              "ui/style.css" = $styleCss
              "ui/app.js" = $appJs
              "native/webview.win32-x64-msvc.node" = $native
            }
          }

          $config |
            ConvertTo-Json -Depth 10 |
            Set-Content `
              -Path "dist/sea-config.json" `
              -Encoding utf8

          Write-Host "SEA configuration:"
          Get-Content "dist/sea-config.json"

      - name: Build MoonWolf Agent executable
        shell: pwsh
        run: |
          node --build-sea dist/sea-config.json

          if ($LASTEXITCODE -ne 0) {
            throw "Node SEA terminó con código $LASTEXITCODE"
          }

          if (-not (Test-Path -LiteralPath "dist/MoonWolf-Agent.exe")) {
            throw "Node SEA no generó dist/MoonWolf-Agent.exe"
          }

      - name: Find editbin
        id: find-editbin
        shell: pwsh
        run: |
          $editbin = $null

          $roots = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio",
            "${env:ProgramFiles}\Microsoft Visual Studio"
          )

          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            Write-Host "Buscando editbin en:"
            Write-Host $root

            $editbin = Get-ChildItem `
              -Path $root `
              -Filter "editbin.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($editbin) {
              break
            }
          }

          if (-not $editbin) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

            if (Test-Path -LiteralPath $vswhere) {
              Write-Host "Usando vswhere para localizar Visual Studio."

              $installationPath = & $vswhere `
                -latest `
                -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                -property installationPath

              if ($installationPath) {
                $editbin = Get-ChildItem `
                  -Path $installationPath `
                  -Filter "editbin.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              }
            }
          }

          if (-not $editbin) {
            throw "No se encontró editbin.exe en el runner de GitHub Actions."
          }

          Write-Host "editbin encontrado:"
          Write-Host $editbin.FullName

          "EDITBIN_PATH=$($editbin.FullName)" >> $env:GITHUB_ENV

      - name: Hide console window
        shell: pwsh
        run: |
          if (-not $env:EDITBIN_PATH) {
            throw "EDITBIN_PATH no está definido."
          }

          $exe = (Resolve-Path "dist/MoonWolf-Agent.exe").Path

          Write-Host "Configurando MoonWolf-Agent como aplicación Windows:"
          Write-Host $exe

          & $env:EDITBIN_PATH `
            /SUBSYSTEM:WINDOWS `
            $exe

          if ($LASTEXITCODE -ne 0) {
            throw "editbin terminó con código $LASTEXITCODE"
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/MoonWolf-Agent.exe"

          if (-not (Test-Path -LiteralPath $exe)) {
            throw "No se generó $exe"
          }

          $size = (Get-Item -LiteralPath $exe).Length

          Write-Host "MoonWolf-Agent.exe: $size bytes"

          if ($size -lt 1MB) {
            throw "El ejecutable generado es sospechosamente pequeño."
          }

          Write-Host "Ejecutable generado correctamente."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe
          if-no-files-found: error

      - name: Determine next Agent version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '
                [.[] |
                  select(.isDraft == false and .isPrerelease == false) |
                  .tagName |
                  select(test("^agent-v[0-9]+\.[0-9]+$"))
                ] |
                sort_by(
                  split("-v")[1] |
                  split(".") |
                  map(tonumber)
                ) |
                last
              '
          )

          if [ -z "$latest" ]; then
            next="agent-v1.0"
          else
            version="${latest#agent-v}"
            major="${version%%.*}"
            minor="${version#*.}"
            next="agent-v${major}.$((minor + 1))"
          fi

          echo "Última versión: ${latest:-ninguna}"
          echo "Nueva versión: $next"

          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create Agent tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" \
            dist/MoonWolf-Agent.exe \
            --title "MoonWolf Agent v${TAG_NAME#agent-v}" \
            --generate-notes
