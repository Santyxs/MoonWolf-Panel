name: Build Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: npm

      - name: Show Node version
        run: node --version

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Install Agent dependencies
        working-directory: agent
        run: npm install --no-package-lock

      - name: Verify WebViewJS
        working-directory: agent
        shell: pwsh
        run: |
          $version = node -p "require('@webviewjs/webview/package.json').version"

          Write-Host "WebViewJS version: $version"

          if ($version -ne "0.4.5") {
            throw "Se esperaba WebViewJS 0.4.5."
          }

          $native = "node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node"

          if (-not (Test-Path $native)) {
            throw "No se encontró el addon nativo WebViewJS para Windows x64."
          }

          Write-Host "Native addon encontrado: $native"

      - name: Clean build directory
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "dist" `
            -Force | Out-Null

      - name: Bundle Agent with esbuild
        shell: pwsh
        run: |
          npx esbuild `
            agent/index.js `
            --bundle `
            --platform=node `
            --target=node24 `
            --format=cjs `
            --external:@webviewjs/webview-win32-x64-msvc `
            --external:@webviewjs/webview-win32-x64-msvc/package.json `
            --outfile=dist/agent.cjs `
            --log-level=info

      - name: Verify Agent bundle
        shell: pwsh
        run: |
          $bundle = "dist/agent.cjs"

          if (-not (Test-Path $bundle)) {
            throw "No se generó dist/agent.cjs."
          }

          $size = (Get-Item $bundle).Length

          Write-Host "Agent bundle: $size bytes"

          if ($size -lt 100KB) {
            throw "El bundle generado es sospechosamente pequeño."
          }

      - name: Create WebViewJS resource map
        shell: pwsh
        run: |
          @'
          {
            "ui/index.html": "agent/ui/index.html",
            "ui/style.css": "agent/ui/style.css",
            "ui/app.js": "agent/ui/app.js",
            "native/webview.win32-x64-msvc.node": "agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node"
          }
          '@ | Set-Content `
            -Path "dist/resources.json" `
            -Encoding utf8

          Write-Host "Resource map:"
          Get-Content "dist/resources.json"

      - name: Validate WebViewJS resource map
        shell: pwsh
        run: |
          $resources = Get-Content `
            "dist/resources.json" `
            -Raw |
            ConvertFrom-Json

          $paths = @(
            $resources.'ui/index.html'
            $resources.'ui/style.css'
            $resources.'ui/app.js'
            $resources.'native/webview.win32-x64-msvc.node'
          )

          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              throw "Resource no encontrado: $path"
            }

            Write-Host "OK: $path"
          }

      - name: Build standalone EXE with WebViewJS CLI
        shell: pwsh
        run: |
          npx webview `
            --build `
            --runtime node `
            --input ./dist/agent.cjs `
            --output ./dist `
            --name MoonWolf-Agent `
            --resources ./dist/resources.json

      - name: Verify standalone executable
        shell: pwsh
        run: |
          $exe = "dist/MoonWolf-Agent.exe"

          if (-not (Test-Path $exe)) {
            throw "No se generó $exe."
          }

          $size = (Get-Item $exe).Length

          Write-Host "MoonWolf-Agent.exe: $size bytes"

          if ($size -lt 10MB) {
            throw "El ejecutable generado es sospechosamente pequeño."
          }

      - name: Hide Windows console subsystem
        shell: pwsh
        run: |
          $editbin = Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\2022" `
            -Filter "editbin.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\Hostx64\\x64\\editbin\.exe$"
            } |
            Select-Object -First 1

          if (-not $editbin) {
            throw "No se encontró editbin.exe."
          }

          Write-Host "editbin: $($editbin.FullName)"

          & $editbin.FullName `
            /SUBSYSTEM:WINDOWS `
            "dist\MoonWolf-Agent.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "editbin falló con código $LASTEXITCODE."
          }

      - name: Final executable verification
        shell: pwsh
        run: |
          $exe = "dist/MoonWolf-Agent.exe"

          if (-not (Test-Path $exe)) {
            throw "El EXE final no existe."
          }

          $size = (Get-Item $exe).Length

          Write-Host ""
          Write-Host "======================================"
          Write-Host " MoonWolf Agent"
          Write-Host " $exe"
          Write-Host " $size bytes"
          Write-Host "======================================"
          Write-Host ""

          if ($size -lt 10MB) {
            throw "El EXE final es demasiado pequeño."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe
          if-no-files-found: error

      - name: Determine next Agent version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '
                [.[] |
                  select(.isDraft == false and .isPrerelease == false) |
                  .tagName |
                  select(test("^agent-v[0-9]+\.[0-9]+$"))
                ] |
                sort_by(
                  split("-v")[1] |
                  split(".") |
                  map(tonumber)
                ) |
                last
              '
          )

          if [ -z "$latest" ]; then
            next="agent-v1.0"
          else
            version="${latest#agent-v}"
            major="${version%%.*}"
            minor="${version#*.}"
            next="agent-v${major}.$((minor + 1))"
          fi

          echo "Última versión: ${latest:-ninguna}"
          echo "Nueva versión: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create Agent tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" \
            dist/MoonWolf-Agent.exe \
            --title "MoonWolf Agent v${TAG_NAME#agent-v}" \
            --generate-notes
