name: "MoonWolf Agent"

on:
  workflow_dispatch:
    inputs:
      publish_release:
        required: false
        default: false
        type: boolean

  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  release:
    types:
      - published

concurrency:
  group: moonwolf-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BUILD_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    name: "Build Windows"
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read

    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'agent-v')

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      # ─────────────────────────────
      # CHECKOUT
      # ─────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # ─────────────────────────────
      # VERIFY
      # ─────────────────────────────

      - name: Verify Agent files
        shell: pwsh
        run: |
          $required = @(
            "agent/Cargo.toml",
            "agent/build.rs",
            "agent/src/main.rs",
            "agent/assets/MoonWolf-Agent.ico",
            "agent/ui/index.html",
            "agent/ui/style.css",
            "agent/ui/app.js"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Missing required file: $file"
            }
          }

          $trackedLock = git ls-files -- 'agent/Cargo.lock'
          if (-not [string]::IsNullOrWhiteSpace($trackedLock)) {
            throw "agent/Cargo.lock está versionado. Este repo compila sin lockfile: bórralo del índice (git rm --cached agent/Cargo.lock)."
          }

          Write-Host "Agent files verified."

      # ─────────────────────────────
      # RUST TOOLCHAIN (MSVC)
      # ─────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: moonwolf-agent-windows-x64
          cache-on-failure: true

      - name: Format Code
        shell: bash
        run: cargo fmt --all
        
      # ─────────────────────────────
      # VERSION
      # ─────────────────────────────

      - name: Determine version
        id: version
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            ver="${tag#agent-v}"

            IFS='.' read -r major minor patch <<< "$ver"

            minor="${minor:-0}"
            patch="${patch:-0}"

            ver="${major}.${minor}.${patch}"
            previous=""

          else
            latest=$(
              gh release list \
                --limit 100 \
                --json tagName,isDraft,isPrerelease \
                --jq '
                  [
                    .[]
                    | select(
                        (.isDraft | not) and
                        (.isPrerelease | not) and
                        (.tagName | startswith("agent-v"))
                      )
                  ]
                  | sort_by(
                      .tagName
                      | ltrimstr("agent-v")
                      | split(".")
                      | map(tonumber)
                    )
                  | last
                  | .tagName // empty
                '
            )

            previous="$latest"

            if [[ -z "$latest" ]]; then
              major=1
              minor=0
            else
              ver="${latest#agent-v}"

              IFS='.' read -r major minor patch <<< "$ver"

              minor="${minor:-0}"
              minor=$((minor + 1))

              if (( minor >= 99 )); then
                major=$((major + 1))
                minor=0
              fi
            fi

            tag="agent-v${major}.${minor}"
            ver="${major}.${minor}.0"
          fi

          ver="${ver#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: versión no numérica tras normalizar: '$ver'" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"

          echo "Building MoonWolf Agent v$ver"

      # ─────────────────────────────
      # VALIDATION IN PULL REQUESTS
      # ─────────────────────────────

      - name: Validate Agent
        if: github.event_name == 'pull_request'
        working-directory: agent
        shell: pwsh
        env:
          MOONWOLF_AGENT_VERSION: "0.0.0"
        run: |
          cargo check --target $env:BUILD_TARGET

          if ($LASTEXITCODE -ne 0) {
            throw "cargo check failed."
          }

      # ─────────────────────────────
      # BUILD
      # ─────────────────────────────

      - name: Build executable
        if: github.event_name != 'pull_request'
        working-directory: agent
        shell: pwsh
        env:
          MOONWOLF_AGENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build `
            --release `
            --target $env:BUILD_TARGET

          if ($LASTEXITCODE -ne 0) {
            throw "Rust compilation failed."
          }

          $exe = "target/$env:BUILD_TARGET/release/moonwolf-agent.exe"

          if (!(Test-Path $exe)) {
            throw "Compiled executable not found."
          }

          # La versión del .exe la inyecta build.rs desde MOONWOLF_AGENT_VERSION.
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion:    $($vi.FileVersion)"
          Write-Host "ProductVersion: $($vi.ProductVersion)"

          if (-not "$($vi.FileVersion)".StartsWith("$env:MOONWOLF_AGENT_VERSION.")) {
            Write-Warning "La versión embebida no coincide con MOONWOLF_AGENT_VERSION=$env:MOONWOLF_AGENT_VERSION"
          }

          Write-Host "Rust compilation successful."

      # ─────────────────────────────
      # PACKAGE
      # ─────────────────────────────

      - name: Package executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $source = "agent/target/$env:BUILD_TARGET/release/moonwolf-agent.exe"
          $destination = "dist/MoonWolf-Agent.exe"

          Copy-Item $source $destination -Force

          $file = Get-Item $destination

          if ($file.Length -lt 500KB) {
            throw "Executable suspiciously small."
          }

          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash

          Write-Host "Executable: $($file.Length) bytes"
          Write-Host "SHA256: $hash"

          "$hash  MoonWolf-Agent.exe" |
            Out-File "dist/SHA256SUMS.txt" -Encoding ascii

      # ─────────────────────────────
      # WORKFLOW ARTIFACT
      # ─────────────────────────────

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent
          path: |
            dist/MoonWolf-Agent.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: "Publish GitHub release"
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: MoonWolf-Agent
          path: dist

      - name: Verify build artifacts
        shell: bash
        run: |
          test -s dist/MoonWolf-Agent.exe
          test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      # ─────────────────────────────
      # AUTOMATIC RELEASE
      # ─────────────────────────────

      - name: Create or update GitHub Release
        if: github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build-windows.outputs.tag }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          PREVIOUS_TAG: ${{ needs.build-windows.outputs.previous_tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/MoonWolf-Agent.exe \
              dist/SHA256SUMS.txt \
              --clobber
            exit 0
          fi

          if [[ -n "$PREVIOUS_TAG" ]]; then
            NOTES="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG_NAME}"
          else
            NOTES="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG_NAME}"
          fi

          printf '%s\n' "$NOTES" > release-notes.md

          gh release create "$TAG_NAME" \
            dist/MoonWolf-Agent.exe \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MoonWolf Agent v${VERSION}" \
            --notes-file release-notes.md

      # ─────────────────────────────
      # EXISTING RELEASE
      # ─────────────────────────────

      - name: Upload to published release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/MoonWolf-Agent.exe \
            dist/SHA256SUMS.txt \
            --clobber
