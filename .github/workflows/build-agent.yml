name: Build Agent (Rust)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  release:
    types: [published]

concurrency:
  group: build-agent-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure full UI CSS/JS in tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p agent/ui
          # Siempre usar la UI original completa del agent Node
          curl -fsSL "https://raw.githubusercontent.com/Santyxs/MoonWolf-Panel/c27b2e00/agent/ui/style.css" \
            -o agent/ui/style.css
          curl -fsSL "https://raw.githubusercontent.com/Santyxs/MoonWolf-Panel/c27b2e00/agent/ui/app.js" \
            -o agent/ui/app.js
          wc -c agent/ui/index.html agent/ui/style.css agent/ui/app.js

          # Si el repo tenía placeholders, dejar los archivos completos en main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/ui/style.css agent/ui/app.js
          if git diff --staged --quiet; then
            echo "UI assets already up to date in git"
          else
            git commit -m "chore(agent): style.css y app.js completos (UI Node original) [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: moonwolf-agent-windows

      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            ver="${tag#agent-v}"
            dots=$(echo "$ver" | tr -cd '.' | wc -c)
            if [ "$dots" -eq 0 ]; then ver="${ver}.0.0"
            elif [ "$dots" -eq 1 ]; then ver="${ver}.0"
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(
            gh release list --limit 50 --exclude-drafts --exclude-pre-releases \
              --json tagName \
              --jq '[.[] | .tagName | select(startswith("agent-v"))] | sort_by(sub("^agent-v"; "") | split(".") | map(tonumber)) | last // empty' \
            2>/dev/null || true
          )
          if [ -z "$latest" ]; then
            next="agent-v1.0"; ver="1.0.0"
          else
            version="${latest#agent-v}"
            major="${version%%.*}"; rest="${version#*.}"; minor="${rest%%.*}"
            if [ "$rest" = "$version" ]; then major="$version"; minor=0; fi
            minor=$((minor + 1))
            if [ "$minor" -ge 99 ]; then major=$((major + 1)); minor=0; fi
            next="agent-v${major}.${minor}"; ver="${major}.${minor}.0"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Set crate version
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        working-directory: agent
        run: |
          VER="$VER"
          dots=$(echo "$VER" | tr -cd '.' | wc -c)
          if [ "$dots" -eq 0 ]; then VER="${VER}.0.0"
          elif [ "$dots" -eq 1 ]; then VER="${VER}.0"
          fi
          sed -i "s/^version = \".*\"/version = \"${VER}\"/" Cargo.toml

      - name: Build release
        working-directory: agent
        shell: bash
        run: |
          cargo build --release
          test -f target/release/moonwolf-agent.exe

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath "agent/target/release/moonwolf-agent.exe" -Destination "dist/MoonWolf-Agent.exe" -Force
          $size = (Get-Item "dist/MoonWolf-Agent.exe").Length
          Write-Host "MoonWolf-Agent.exe: $size bytes"
          if ($size -lt 500KB) { throw "Executable suspiciously small" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe
          if-no-files-found: error

      - name: Create tag + GitHub Release
        if: github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/MoonWolf-Agent.exe --clobber
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$GITHUB_SHA" || true
          git push origin "$TAG_NAME" || true
          gh release create "$TAG_NAME" dist/MoonWolf-Agent.exe \
            --title "MoonWolf Agent v${TAG_NAME#agent-v} (Rust)" \
            --notes "Agent nativo Rust. UI original.\n**Commit:** ${GITHUB_SHA}"

      - name: Upload asset to existing release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/MoonWolf-Agent.exe --clobber
