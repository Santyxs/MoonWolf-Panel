name: "MoonWolf Agent"

on:
  workflow_dispatch:
    inputs:
      publish_release:
        required: false
        default: false
        type: boolean

  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  release:
    types:
      - published

concurrency:
  group: moonwolf-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    name: "Build Windows"
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read

    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'agent-v')

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Agent files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "agent/Cargo.toml",
            "agent/build.rs",
            "agent/src/main.rs",
            "agent/assets/MoonWolf-Agent.ico",
            "agent/ui/index.html",
            "agent/ui/style.css",
            "agent/ui/app.js"
          )

          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing required file: $file"
            }
          }

          $trackedLock = git ls-files -- 'agent/Cargo.lock'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect tracked files with Git."
          }

          if (-not [string]::IsNullOrWhiteSpace($trackedLock)) {
            throw "agent/Cargo.lock está versionado. Este repositorio compila sin lockfile."
          }

          Write-Host "Agent files verified."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: moonwolf-agent-windows-x64
          cache-on-failure: true

      - name: Check Rust formatting
        working-directory: agent
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            throw "Rust formatting check failed. Run 'cargo fmt --all' locally."
          }

      - name: Determine version
        id: version
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $previousTag = ""

          if ($env:GITHUB_EVENT_NAME -eq "release") {
            $tag = $env:RELEASE_TAG

            if ($tag -notmatch '^agent-v(?<version>\d+\.\d+(?:\.\d+)?)$') {
              throw "Invalid Agent release tag: '$tag'. Expected agent-vMAJOR.MINOR[.PATCH]."
            }

            $versionParts = $Matches.version.Split('.')
            if ($versionParts.Count -eq 2) {
              $version = "$($versionParts[0]).$($versionParts[1]).0"
            }
            else {
              $version = $Matches.version
            }
          }
          else {
            $releaseJson = gh release list --limit 100 --json tagName,isDraft,isPrerelease
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve existing GitHub Releases."
            }

            $releases = @($releaseJson | ConvertFrom-Json)
            $validReleases = foreach ($release in $releases) {
              if ($release.isDraft -or $release.isPrerelease) {
                continue
              }

              $releaseTag = [string]$release.tagName
              if ($releaseTag -notmatch '^agent-v(?<version>\d+\.\d+(?:\.\d+)?)$') {
                continue
              }

              $parts = $Matches.version.Split('.')
              if ($parts.Count -eq 2) {
                $normalizedVersion = "$($parts[0]).$($parts[1]).0"
              }
              else {
                $normalizedVersion = $Matches.version
              }

              try {
                [pscustomobject]@{
                  Tag     = $releaseTag
                  Version = [version]$normalizedVersion
                }
              }
              catch {
                continue
              }
            }

            $latest = $validReleases | Sort-Object -Property Version | Select-Object -Last 1

            if ($null -eq $latest) {
              $major = 1
              $minor = 0
            }
            else {
              $previousTag = $latest.Tag
              $major = $latest.Version.Major
              $minor = $latest.Version.Minor + 1

              if ($minor -ge 99) {
                $major++
                $minor = 0
              }
            }

            $tag = "agent-v$major.$minor"
            $version = "$major.$minor.0"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid normalized Agent version: '$version'."
          }

          $output = "tag=$tag`nversion=$version`nprevious_tag=$previousTag`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            $output,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Building MoonWolf Agent v$version ($tag)"

      - name: Validate Agent
        if: github.event_name == 'pull_request'
        working-directory: agent
        shell: pwsh
        run: |
          cargo check --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) {
            throw "cargo check failed."
          }

      - name: Build executable
        if: github.event_name != 'pull_request'
        working-directory: agent
        shell: pwsh
        env:
          MOONWOLF_AGENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) {
            throw "Rust compilation failed."
          }

          $exe = "target/$env:BUILD_TARGET/release/moonwolf-agent.exe"
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Compiled executable not found: $exe"
          }

          $versionInfo = (Get-Item -LiteralPath $exe).VersionInfo
          Write-Host "FileVersion:    $($versionInfo.FileVersion)"
          Write-Host "ProductVersion: $($versionInfo.ProductVersion)"

          $fileVersion = [string]$versionInfo.FileVersion
          if (-not $fileVersion.StartsWith("$env:MOONWOLF_AGENT_VERSION.")) {
            throw "Embedded executable version does not match $env:MOONWOLF_AGENT_VERSION."
          }

          Write-Host "Rust compilation successful."

      - name: Package executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $source = "agent/target/$env:BUILD_TARGET/release/moonwolf-agent.exe"
          $destination = "dist/MoonWolf-Agent.exe"

          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Build output missing: $source"
          }

          Copy-Item -LiteralPath $source -Destination $destination -Force
          $file = Get-Item -LiteralPath $destination

          if ($file.Length -lt 500KB) {
            throw "Executable suspiciously small: $($file.Length) bytes."
          }

          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          Write-Host "Executable: $($file.Length) bytes"
          Write-Host "SHA256: $hash"

          $checksumLine = "$hash  MoonWolf-Agent.exe`n"
          [System.IO.File]::WriteAllText(
            "dist/SHA256SUMS.txt",
            $checksumLine,
            [System.Text.Encoding]::ASCII
          )

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent
          path: |
            dist/MoonWolf-Agent.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: "Publish GitHub release"
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: MoonWolf-Agent
          path: dist

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist/MoonWolf-Agent.exe"
          $checksumFile = "dist/SHA256SUMS.txt"

          foreach ($file in @($exe, $checksumFile)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required artifact missing: $file"
            }
          }

          $checksumLine = (Get-Content -LiteralPath $checksumFile -Raw).Trim()
          if ($checksumLine -notmatch '^(?<hash>[A-Fa-f0-9]{64})\s+MoonWolf-Agent\.exe$') {
            throw "Invalid SHA256SUMS.txt format."
          }

          $expectedHash = $Matches.hash.ToUpperInvariant()
          $actualHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash

          if ($actualHash -ne $expectedHash) {
            throw "SHA256 verification failed. Expected $expectedHash; received $actualHash."
          }

          Write-Host "SHA256 verified: $actualHash"

      - name: Create or update GitHub Release
        if: github.event_name != 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build-windows.outputs.tag }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          PREVIOUS_TAG: ${{ needs.build-windows.outputs.previous_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release view $env:TAG_NAME --json tagName *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            gh release upload $env:TAG_NAME `
              dist/MoonWolf-Agent.exe `
              dist/SHA256SUMS.txt `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload assets to release $env:TAG_NAME."
            }

            Write-Host "Updated release $env:TAG_NAME."
          }
          else {
            if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG)) {
              $notes = "**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$env:PREVIOUS_TAG...$env:TAG_NAME"
            }
            else {
              $notes = "**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/commits/$env:TAG_NAME"
            }

            [System.IO.File]::WriteAllText(
              "release-notes.md",
              $notes,
              [System.Text.UTF8Encoding]::new($false)
            )

            gh release create $env:TAG_NAME `
              dist/MoonWolf-Agent.exe `
              dist/SHA256SUMS.txt `
              --target $env:GITHUB_SHA `
              --title "MoonWolf Agent v$env:VERSION" `
              --notes-file release-notes.md

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release $env:TAG_NAME."
            }

            Write-Host "Created release $env:TAG_NAME."
          }

      - name: Upload to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload $env:TAG_NAME `
            dist/MoonWolf-Agent.exe `
            dist/SHA256SUMS.txt `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload assets to published release $env:TAG_NAME."
          }

          Write-Host "Assets uploaded to published release $env:TAG_NAME."
