name: Build Agent

on:
workflow_dispatch:

push:
branches:
- main
paths:
- 'agent/**'
- '.github/workflows/build-agent.yml'
- 'package.json'
- 'package-lock.json'

permissions:
contents: read

jobs:
build-windows:
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Setup Node.js
    uses: actions/setup-node@v5
    with:
      node-version: 26.9.0

  - name: Show Node version
    run: node --version

  - name: Install root dependencies
    run: npm install --include=dev

  - name: Install Agent dependencies
    working-directory: agent
    run: npm install --no-package-lock

  - name: Verify WebViewJS
    shell: pwsh
    run: |
      Write-Host "WebViewJS:"
      npm --prefix agent list @webviewjs/webview --depth=0

      $native = "agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node"

      if (-not (Test-Path -LiteralPath $native)) {
        throw "No se encontró el addon nativo de WebViewJS: $native"
      }

      Write-Host "Addon nativo encontrado:"
      Write-Host (Resolve-Path -LiteralPath $native)

  - name: Patch WebViewJS native loader for SEA
    shell: pwsh
    run: |
      $file = "agent/node_modules/@webviewjs/webview/js-bindings.js"

      if (-not (Test-Path -LiteralPath $file)) {
        throw "No se encontró js-bindings.js"
      }

      $content = Get-Content -LiteralPath $file -Raw

      $old = "return require(process.env.NAPI_RS_NATIVE_LIBRARY_PATH);"

      if (-not $content.Contains($old)) {
        throw "No se encontró la línea esperada en js-bindings.js."
      }

      $new = @"
```

const nativeModule = {
exports: {}
};

```
  process.dlopen(
    nativeModule,
    process.env.NAPI_RS_NATIVE_LIBRARY_PATH
  );

  return nativeModule.exports;
```

"@

```
      $content = $content.Replace(
        $old,
        $new.Trim()
      )

      Set-Content `
        -LiteralPath $file `
        -Value $content `
        -Encoding utf8

      Write-Host "Parche aplicado correctamente."

  - name: Prepare build directory
    shell: pwsh
    run: |
      if (Test-Path -LiteralPath "dist") {
        Remove-Item `
          -LiteralPath "dist" `
          -Recurse `
          -Force
      }

      New-Item `
        -ItemType Directory `
        -Force `
        -Path "dist" |
        Out-Null

  - name: Create WebViewJS native shim
    shell: pwsh
    run: |
      "module.exports = {};" |
        Set-Content `
          -Path "agent/webview-native-shim.js" `
          -Encoding utf8

  - name: Bundle Agent
    shell: pwsh
    run: |
      npx esbuild agent/index.js `
        --bundle `
        --platform=node `
        --target=node24 `
        --format=cjs `
        --alias:@webviewjs/webview-win32-x64-msvc=./webview-native-shim.js `
        --outfile=dist/agent.cjs `
        --log-level=info

      if ($LASTEXITCODE -ne 0) {
        throw "esbuild terminó con código $LASTEXITCODE"
      }

  - name: Verify bundle
    shell: pwsh
    run: |
      $bundle = "dist/agent.cjs"

      if (-not (Test-Path -LiteralPath $bundle)) {
        throw "No se generó $bundle"
      }

      $size = (Get-Item -LiteralPath $bundle).Length

      Write-Host "agent.cjs: $size bytes"

      if ($size -lt 100KB) {
        throw "El bundle generado es sospechosamente pequeño."
      }

  - name: Upload build
    uses: actions/upload-artifact@v4
    with:
      name: MoonWolf-Agent-Build
      path: dist/agent.cjs
      if-no-files-found: error
```
