name: "MoonWolf Agent"

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  release:
    types:
      - published

concurrency:
  group: moonwolf-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BUILD_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    name: "Build Windows"
    runs-on: windows-latest

    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'agent-v')

    steps:
      # ─────────────────────────────
      # CHECKOUT
      # ─────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─────────────────────────────
      # VERIFY (sin exigir Cargo.lock todavía)
      # ─────────────────────────────

      - name: Verify Agent files
        shell: pwsh
        run: |
          $required = @(
            "agent/Cargo.toml",
            "agent/src/main.rs",
            "agent/build.rs",
            "agent/assets/MoonWolf-Agent.ico",
            "agent/ui/index.html",
            "agent/ui/style.css",
            "agent/ui/app.js"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Missing required file: $file"
            }
          }

          Write-Host "Agent files verified."

      # ─────────────────────────────
      # RUST TOOLCHAIN (MSVC)
      # ─────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: moonwolf-agent-windows-x64

      # ─────────────────────────────
      # VERSION
      # ─────────────────────────────

      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            ver="${tag#agent-v}"

            IFS='.' read -r major minor patch <<< "$ver"

            minor="${minor:-0}"
            patch="${patch:-0}"

            ver="${major}.${minor}.${patch}"
            previous=""

          else
            latest=$(
              gh release list \
                --limit 100 \
                --json tagName,isDraft,isPrerelease \
                --jq '
                  [
                    .[]
                    | select(
                        (.isDraft | not) and
                        (.isPrerelease | not) and
                        (.tagName | startswith("agent-v"))
                      )
                  ]
                  | sort_by(
                      .tagName
                      | ltrimstr("agent-v")
                      | split(".")
                      | map(tonumber)
                    )
                  | last
                  | .tagName // empty
                '
            )

            previous="$latest"

            if [[ -z "$latest" ]]; then
              major=1
              minor=0
            else
              ver="${latest#agent-v}"

              IFS='.' read -r major minor patch <<< "$ver"

              minor="${minor:-0}"
              minor=$((minor + 1))

              if (( minor >= 99 )); then
                major=$((major + 1))
                minor=0
              fi
            fi

            tag="agent-v${major}.${minor}"
            ver="${major}.${minor}.0"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"

          echo "Building MoonWolf Agent v$ver"

      # ─────────────────────────────
      # UPDATE CRATE VERSION + env
      # ─────────────────────────────

      - name: Set Rust package version
        working-directory: agent
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Actualiza version en Cargo.toml
          sed -i "0,/^version = /s//version = \"$VERSION\"/" Cargo.toml
          grep '^version = ' Cargo.toml

          # Genera Cargo.lock si aún no existe (requerido por --locked)
          if [[ ! -f Cargo.lock ]]; then
            echo "Cargo.lock no encontrado → generando con cargo generate-lockfile"
            cargo generate-lockfile
          fi

          test -f Cargo.lock || { echo "ERROR: no se pudo generar Cargo.lock"; exit 1; }
          echo "Cargo.lock listo."

      # ─────────────────────────────
      # BUILD (MSVC + optimizaciones)
      # ─────────────────────────────

      - name: Build optimized executable
        working-directory: agent
        shell: pwsh
        env:
          MOONWOLF_AGENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build `
            --release `
            --locked `
            --target $env:BUILD_TARGET

          if ($LASTEXITCODE -ne 0) {
            throw "Rust compilation failed."
          }

          $exe = "target/$env:BUILD_TARGET/release/moonwolf-agent.exe"

          if (!(Test-Path $exe)) {
            throw "Compiled executable not found."
          }

          Write-Host "Rust compilation successful."

      # ─────────────────────────────
      # PACKAGE
      # ─────────────────────────────

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $source = "agent/target/$env:BUILD_TARGET/release/moonwolf-agent.exe"
          $destination = "dist/MoonWolf-Agent.exe"

          Copy-Item $source $destination -Force

          $file = Get-Item $destination

          if ($file.Length -lt 500KB) {
            throw "Executable suspiciously small."
          }

          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash

          Write-Host "Executable: $($file.Length) bytes"
          Write-Host "SHA256: $hash"

          "$hash  MoonWolf-Agent.exe" |
            Out-File "dist/SHA256SUMS.txt" -Encoding ascii

      # ─────────────────────────────
      # WORKFLOW ARTIFACT
      # ─────────────────────────────

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoonWolf-Agent-Windows
          path: |
            dist/MoonWolf-Agent.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ─────────────────────────────
      # AUTOMATIC RELEASE
      # ─────────────────────────────

      - name: Create or update GitHub Release
        if: github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/MoonWolf-Agent.exe \
              dist/SHA256SUMS.txt \
              --clobber
            exit 0
          fi

          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGELOG_LINE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG_NAME}"
          else
            CHANGELOG_LINE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG_NAME}"
          fi

          cat > release-notes.md << EOF
          ## MoonWolf Agent v${VERSION}

          - Native Windows executable (MSVC).
          - Optimized release build (opt-level=3, LTO, strip).
          - Embedded application icon.
          - SHA256 checksum included.

          ${CHANGELOG_LINE}
          EOF

          gh release create "$TAG_NAME" \
            dist/MoonWolf-Agent.exe \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MoonWolf Agent v${VERSION}" \
            --notes-file release-notes.md

      # ─────────────────────────────
      # EXISTING RELEASE
      # ─────────────────────────────

      - name: Upload to published release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/MoonWolf-Agent.exe \
            dist/SHA256SUMS.txt \
            --clobber
