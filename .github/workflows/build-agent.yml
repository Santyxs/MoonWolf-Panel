name: Build MoonWolf Agent

on:
  workflow_dispatch:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Install Agent dependencies
        working-directory: agent
        run: npm install

      - name: Bundle Agent
        run: node build-agent.mjs

      - name: Build Windows executable
        run: node --build-sea sea-config.json

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/MoonWolf-Agent.exe')) {
            throw 'No se generó dist/MoonWolf-Agent.exe'
          }
          $size = (Get-Item 'dist/MoonWolf-Agent.exe').Length
          Write-Host "MoonWolf-Agent.exe: $size bytes"
          if ($size -lt 1MB) {
            throw 'El ejecutable generado es sospechosamente pequeño.'
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MoonWolf-Agent.exe \
            --title "MoonWolf Agent $GITHUB_REF_NAME" \
            --generate-notes
