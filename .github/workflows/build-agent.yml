name: Build Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'server.js'
      - '.github/workflows/build-agent.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Show Node version
        run: node --version

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Install Agent dependencies
        working-directory: agent
        run: npm install --no-package-lock

      - name: Verify WebViewJS
        shell: pwsh
        run: |
          Write-Host "WebViewJS:"
          npm --prefix agent list @webviewjs/webview --depth=0

          $native = "agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node"

          if (-not (Test-Path -LiteralPath $native)) {
            throw "No se encontró el addon nativo de WebViewJS: $native"
          }

          Write-Host "Addon nativo encontrado:"
          Write-Host (Resolve-Path -LiteralPath $native)

      - name: Patch WebViewJS native loader for SEA
        shell: pwsh
        run: |
          $file = "agent/node_modules/@webviewjs/webview/js-bindings.js"

          if (-not (Test-Path -LiteralPath $file)) {
            throw "No se encontró js-bindings.js"
          }

          $content = Get-Content -LiteralPath $file -Raw
          $old = "return require(process.env.NAPI_RS_NATIVE_LIBRARY_PATH);"

          if (-not $content.Contains($old)) {
            throw "No se encontró la línea esperada en js-bindings.js."
          }

          $new = @(
            'const nativeModule = {'
            '  exports: {}'
            '};'
            ''
            'process.dlopen('
            '  nativeModule,'
            '  process.env.NAPI_RS_NATIVE_LIBRARY_PATH,'
            '  2'
            ');'
            ''
            'return nativeModule.exports;'
          ) -join "`n"

          $content = $content.Replace($old, $new)
          Set-Content -LiteralPath $file -Value $content -Encoding utf8
          Write-Host "Parche aplicado correctamente."

      - name: Prepare Agent build directory
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "dist") {
            Remove-Item -LiteralPath "dist" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

      - name: Determine next Agent version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(
            gh release list               --limit 100               --json tagName,isDraft,isPrerelease               --jq '
                [.[] |
                  select(.isDraft == false and .isPrerelease == false) |
                  .tagName |
                  select(startswith("agent-v")) |
                  split("-v")[1] |
                  split(".") |
                  select(length == 2) |
                  map(tonumber)
                ] |
                sort |
                last |
                if . == null then
                  ""
                else
                  "agent-v" + (.[0] | tostring) + "." + (.[1] | tostring)
                end
              '
          )

          if [ -z "$latest" ]; then
            next="agent-v1.0"
          else
            version="${latest#agent-v}"
            major="${version%%.*}"
            minor="${version#*.}"
            next="agent-v${major}.$((minor + 1))"
          fi

          echo "Última versión: ${latest:-ninguna}"
          echo "Nueva versión: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create WebViewJS native shim
        shell: pwsh
        run: |
          @'
          module.exports = {};
          '@ | Set-Content `
            -Path "agent/webview-native-shim.js" `
            -Encoding utf8

      - name: Bundle Agent
        shell: bash
        env:
          AGENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          npx esbuild agent/index.js             --bundle             --platform=node             --target=node24             --format=cjs             --alias:@webviewjs/webview-win32-x64-msvc=./webview-native-shim.js             --define:__AGENT_VERSION__="\"${AGENT_TAG#agent-v}\""             --outfile=dist/agent.cjs             --log-level=info

      - name: Verify bundle
        shell: pwsh
        run: |
          $bundle = "dist/agent.cjs"
          if (-not (Test-Path -LiteralPath $bundle)) {
            throw "No se generó $bundle"
          }
          $size = (Get-Item -LiteralPath $bundle).Length
          Write-Host "agent.cjs: $size bytes"
          if ($size -lt 100KB) {
            throw "El bundle generado es sospechosamente pequeño."
          }

      - name: Create Node SEA configuration
        shell: pwsh
        run: |
          $native = (Resolve-Path `
            "agent/node_modules/@webviewjs/webview-win32-x64-msvc/webview.win32-x64-msvc.node").Path
          $main = (Resolve-Path "dist/agent.cjs").Path
          $blob = Join-Path (Resolve-Path "dist").Path "sea-prep.blob"
          $indexHtml = (Resolve-Path "agent/ui/index.html").Path
          $styleCss = (Resolve-Path "agent/ui/style.css").Path
          $appJs = (Resolve-Path "agent/ui/app.js").Path

          $config = @{
            main = $main
            mainFormat = "commonjs"
            output = $blob
            disableExperimentalSEAWarning = $true
            useSnapshot = $false
            useCodeCache = $false
            assets = @{
              "ui/index.html" = $indexHtml
              "ui/style.css" = $styleCss
              "ui/app.js" = $appJs
              "native/webview.win32-x64-msvc.node" = $native
            }
          }

          $config | ConvertTo-Json -Depth 10 | Set-Content -Path "dist/sea-config.json" -Encoding utf8

      - name: Build Agent executable
        shell: pwsh
        run: |
          node --experimental-sea-config dist/sea-config.json
          if ($LASTEXITCODE -ne 0) { throw "La generación del blob SEA terminó con código $LASTEXITCODE" }

          $blob = (Resolve-Path "dist/sea-prep.blob").Path
          $exe = Join-Path (Resolve-Path "dist").Path "MoonWolf-Agent.exe"
          $nodePath = (Get-Command node).Source

          if (-not (Test-Path -LiteralPath $blob)) { throw "No se generó $blob" }
          Copy-Item -LiteralPath $nodePath -Destination $exe -Force
          if (-not (Test-Path -LiteralPath $exe)) { throw "No se pudo crear $exe" }

          Write-Host "Node executable: $nodePath"
          Write-Host "SEA blob: $blob"
          Write-Host "Target executable: $exe"

          $binaryBytes = [System.IO.File]::ReadAllBytes($exe)
          $binaryText = [System.Text.Encoding]::ASCII.GetString($binaryBytes)
          $sentinelMatch = [regex]::Match($binaryText, 'NODE_SEA_FUSE_[A-Za-z0-9]+')
          if (-not $sentinelMatch.Success) { throw "No se encontró ningún SEA sentinel fuse dentro de node.exe" }
          $sentinelFuse = $sentinelMatch.Value

          Write-Host "SEA sentinel detectado: $sentinelFuse"
          npx --yes postject $exe NODE_SEA_BLOB $blob --sentinel-fuse $sentinelFuse --overwrite
          if ($LASTEXITCODE -ne 0) { throw "postject terminó con código $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $exe)) { throw "No se generó $exe" }
          Write-Host "MoonWolf-Agent.exe generado correctamente."

      - name: Hide Windows console
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/MoonWolf-Agent.exe").Path
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "No se encontró vswhere.exe" }

          $editbin = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "**/Hostx64/x64/editbin.exe" | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($editbin) -or -not (Test-Path -LiteralPath $editbin)) {
            throw "No se encontró editbin.exe"
          }

          Write-Host "Usando editbin: $editbin"
          & $editbin /SUBSYSTEM:WINDOWS $exe
          if ($LASTEXITCODE -ne 0) { throw "editbin terminó con código $LASTEXITCODE" }
          Write-Host "Terminal de Windows ocultada correctamente."

      - name: Set executable icon
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/MoonWolf-Agent.exe").Path
          $pngBase64 = ''
          $srcPng = [Convert]::FromBase64String($pngBase64)

          # ---- Decodificador PNG mínimo (32x32, RGBA, 8bpp, sin interlace) ----
          function Decode-PngRgba {
            param([byte[]]$Png)

            $sig = [byte[]](0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a)
            for ($i=0; $i -lt 8; $i++) {
              if ($Png[$i] -ne $sig[$i]) { throw "PNG inválido." }
            }

            $offset = 8
            $width = 0; $height = 0; $bitDepth = 0; $colorType = 0
            $idat = New-Object System.Collections.Generic.List[byte[]]

            while ($offset -lt $Png.Length) {
              $len = [BitConverter]::ToUInt32(($Png[($offset+3)..$offset]),0)
              $type = [System.Text.Encoding]::ASCII.GetString($Png, $offset+4, 4)
              $dataStart = $offset+8
              $data = $Png[$dataStart..($dataStart+$len-1)]

              if ($type -eq 'IHDR') {
                $width = [BitConverter]::ToUInt32(($data[3..0]),0)
                $height = [BitConverter]::ToUInt32(($data[7..4]),0)
                $bitDepth = $data[8]
                $colorType = $data[9]
              } elseif ($type -eq 'IDAT') {
                $idat.Add($data)
              } elseif ($type -eq 'IEND') {
                break
              }

              $offset = $dataStart + $len + 4
            }

            if ($bitDepth -ne 8 -or $colorType -ne 6) { throw "Formato PNG no soportado." }

            $compressed = [byte[]]($idat | ForEach-Object { $_ })
            $ms = New-Object System.IO.MemoryStream(,$compressed)
            $ms.ReadByte() | Out-Null; $ms.ReadByte() | Out-Null   # cabecera zlib (2 bytes)
            $ds = New-Object System.IO.Compression.DeflateStream($ms, [System.IO.Compression.CompressionMode]::Decompress)
            $rawMs = New-Object System.IO.MemoryStream
            $ds.CopyTo($rawMs)
            $raw = $rawMs.ToArray()

            $bpp = 4
            $stride = $width * $bpp
            $rgba = New-Object byte[] ($width * $height * 4)
            $prev = New-Object byte[] $stride
            $cur = New-Object byte[] $stride
            $rawOffset = 0
            $outOffset = 0

            function Paeth($a,$b,$c) {
              $p = $a + $b - $c
              $pa = [Math]::Abs($p - $a); $pb = [Math]::Abs($p - $b); $pc = [Math]::Abs($p - $c)
              if ($pa -le $pb -and $pa -le $pc) { return $a }
              if ($pb -le $pc) { return $b }
              return $c
            }

            for ($y=0; $y -lt $height; $y++) {
              $filter = $raw[$rawOffset]; $rawOffset++
              for ($x=0; $x -lt $stride; $x++) {
                $val = $raw[$rawOffset]; $rawOffset++
                $left = if ($x -ge $bpp) { $cur[$x-$bpp] } else { 0 }
                $up = $prev[$x]
                $upLeft = if ($x -ge $bpp) { $prev[$x-$bpp] } else { 0 }
                $rec = switch ($filter) {
                  0 { $val }
                  1 { $val + $left }
                  2 { $val + $up }
                  3 { $val + [Math]::Floor(($left+$up)/2) }
                  4 { $val + (Paeth $left $up $upLeft) }
                  default { throw "Filtro PNG no soportado." }
                }
                $cur[$x] = $rec -band 0xFF
              }
              [Array]::Copy($cur, 0, $rgba, $outOffset, $stride)
              $outOffset += $stride
              [Array]::Copy($cur, $prev, $stride)
            }

            return @{ Width = $width; Height = $height; Rgba = $rgba }
          }

          $decoded = Decode-PngRgba -Png $srcPng

          function Resize-NearestRgba {
            param($Decoded, [int]$NewSize)
            $srcW = $Decoded.Width; $srcH = $Decoded.Height
            $src = $Decoded.Rgba
            $dst = New-Object byte[] ($NewSize * $NewSize * 4)
            for ($y=0; $y -lt $NewSize; $y++) {
              $sy = [Math]::Min($srcH-1, [int]([Math]::Floor($y * $srcH / $NewSize)))
              for ($x=0; $x -lt $NewSize; $x++) {
                $sx = [Math]::Min($srcW-1, [int]([Math]::Floor($x * $srcW / $NewSize)))
                $sOff = ($sy*$srcW + $sx)*4
                $dOff = ($y*$NewSize + $x)*4
                [Array]::Copy($src, $sOff, $dst, $dOff, 4)
              }
            }
            return $dst
          }

          function Build-IconImageData {
            param([byte[]]$Rgba, [int]$Size)

            $xorRowBytes = $Size * 4
            $xor = New-Object byte[] ($xorRowBytes * $Size)
            $maskRowBytes = [Math]::Ceiling($Size / 32.0) * 4
            $mask = New-Object byte[] ($maskRowBytes * $Size)

            # Bottom-up: la última fila de la imagen va primero en el DIB del icono
            for ($y=0; $y -lt $Size; $y++) {
              $srcRow = $Size - 1 - $y
              for ($x=0; $x -lt $Size; $x++) {
                $srcOff = ($srcRow*$Size + $x)*4
                $r = $Rgba[$srcOff]; $g = $Rgba[$srcOff+1]; $b = $Rgba[$srcOff+2]; $a = $Rgba[$srcOff+3]
                $dstOff = ($y*$Size + $x)*4
                $xor[$dstOff]   = $b
                $xor[$dstOff+1] = $g
                $xor[$dstOff+2] = $r
                $xor[$dstOff+3] = $a
                if ($a -lt 8) {
                  $byteIndex = $y*$maskRowBytes + [Math]::Floor($x/8)
                  $bitIndex = 7 - ($x % 8)
                  $mask[$byteIndex] = $mask[$byteIndex] -bor (1 -shl $bitIndex)
                }
              }
            }

            $header = New-Object byte[] 40
            [BitConverter]::GetBytes([uint32]40).CopyTo($header, 0)
            [BitConverter]::GetBytes([int32]$Size).CopyTo($header, 4)
            [BitConverter]::GetBytes([int32]($Size*2)).CopyTo($header, 8)
            [BitConverter]::GetBytes([uint16]1).CopyTo($header, 12)
            [BitConverter]::GetBytes([uint16]32).CopyTo($header, 14)
            [BitConverter]::GetBytes([uint32]0).CopyTo($header, 16)
            [BitConverter]::GetBytes([uint32]($xor.Length + $mask.Length)).CopyTo($header, 20)

            $full = New-Object byte[] ($header.Length + $xor.Length + $mask.Length)
            [Array]::Copy($header, 0, $full, 0, $header.Length)
            [Array]::Copy($xor, 0, $full, $header.Length, $xor.Length)
            [Array]::Copy($mask, 0, $full, $header.Length + $xor.Length, $mask.Length)
            return $full
          }

          $sizes = @(16, 32)
          $images = @()
          foreach ($size in $sizes) {
            $rgba = if ($size -eq $decoded.Width) { $decoded.Rgba } else { Resize-NearestRgba -Decoded $decoded -NewSize $size }
            $images += ,@{ Size = $size; Data = (Build-IconImageData -Rgba $rgba -Size $size) }
          }

          # ---- Grupo GRPICONDIR (6 bytes) + GRPICONDIRENTRY (14 bytes) por imagen ----
          $group = New-Object byte[] (6 + 14 * $images.Count)
          [BitConverter]::GetBytes([uint16]0).CopyTo($group, 0)
          [BitConverter]::GetBytes([uint16]1).CopyTo($group, 2)
          [BitConverter]::GetBytes([uint16]$images.Count).CopyTo($group, 4)

          for ($i=0; $i -lt $images.Count; $i++) {
            $off = 6 + $i*14
            $s = $images[$i].Size
            $group[$off]   = [byte]($s -band 0xFF)   # 256 se representaría como 0, no aplica aquí
            $group[$off+1] = [byte]($s -band 0xFF)
            $group[$off+2] = 0
            $group[$off+3] = 0
            [BitConverter]::GetBytes([uint16]1).CopyTo($group, $off+4)
            [BitConverter]::GetBytes([uint16]32).CopyTo($group, $off+6)
            [BitConverter]::GetBytes([uint32]$images[$i].Data.Length).CopyTo($group, $off+8)
            [BitConverter]::GetBytes([uint16]($i+1)).CopyTo($group, $off+12)
          }

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MoonWolfResources {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr BeginUpdateResource(string pFileName, bool bDeleteExistingResources);

              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool UpdateResource(IntPtr hUpdate, IntPtr lpType, IntPtr lpName, ushort wLanguage, byte[] lpData, uint cbData);

              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool EndUpdateResource(IntPtr hUpdate, bool fDiscard);

              public static IntPtr MAKEINTRESOURCE(ushort value) { return new IntPtr(value); }

              public const ushort LANG_NEUTRAL = 0x0000;
              public const ushort RT_ICON = 3;
              public const ushort RT_GROUP_ICON = 14;
          }
'@

          $handle = [MoonWolfResources]::BeginUpdateResource($exe, $false)
          if ($handle -eq [IntPtr]::Zero) {
            throw "BeginUpdateResource falló. Win32Error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }

          try {
            for ($i=0; $i -lt $images.Count; $i++) {
              $data = $images[$i].Data
              $ok = [MoonWolfResources]::UpdateResource(
                $handle,
                [MoonWolfResources]::MAKEINTRESOURCE([MoonWolfResources]::RT_ICON),
                [MoonWolfResources]::MAKEINTRESOURCE([uint16]($i+1)),
                [MoonWolfResources]::LANG_NEUTRAL,
                $data,
                [uint32]$data.Length
              )
              if (-not $ok) { throw "UpdateResource(RT_ICON $($i+1)) falló. Win32Error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
            }

            $ok = [MoonWolfResources]::UpdateResource(
              $handle,
              [MoonWolfResources]::MAKEINTRESOURCE([MoonWolfResources]::RT_GROUP_ICON),
              [MoonWolfResources]::MAKEINTRESOURCE(1),
              [MoonWolfResources]::LANG_NEUTRAL,
              $group,
              [uint32]$group.Length
            )
            if (-not $ok) { throw "UpdateResource(RT_GROUP_ICON) falló. Win32Error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }

            if (-not [MoonWolfResources]::EndUpdateResource($handle, $false)) {
              throw "EndUpdateResource falló. Win32Error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
            }
            $handle = [IntPtr]::Zero
          }
          finally {
            if ($handle -ne [IntPtr]::Zero) {
              [MoonWolfResources]::EndUpdateResource($handle, $true) | Out-Null
            }
          }

          Write-Host "Icono de MoonWolf (16x16 + 32x32, DIB clásico) incrustado correctamente."

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/MoonWolf-Agent.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "No se generó $exe" }
          $size = (Get-Item -LiteralPath $exe).Length
          Write-Host "MoonWolf-Agent.exe: $size bytes"
          if ($size -lt 1MB) { throw "El ejecutable generado es sospechosamente pequeño." }
          Write-Host "Ejecutable generado correctamente."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent-Windows
          path: dist/MoonWolf-Agent.exe
          if-no-files-found: error

      - name: Create Agent tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG_NAME"             dist/MoonWolf-Agent.exe             --title "MoonWolf Agent v${TAG_NAME#agent-v}"             --generate-notes
