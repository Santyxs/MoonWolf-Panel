
name: "MoonWolf Agent"

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release"
        required: false
        default: false
        type: boolean

  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  release:
    types:
      - published

concurrency:
  group: moonwolf-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BUILD_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    name: "Build Windows"
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"

    permissions:
      contents: read

    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'agent-v')

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Agent files
        shell: pwsh
        run: |
          $required = @(
            "agent/Cargo.toml",
            "agent/build.rs",
            "agent/src/main.rs",
            "agent/assets/MoonWolf-Agent.ico",
            "agent/ui/main.slint"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Missing required file: $file"
            }
          }

          $trackedLock = git ls-files -- 'agent/Cargo.lock'

          if (-not [string]::IsNullOrWhiteSpace($trackedLock)) {
            throw "agent/Cargo.lock está versionado. Este repositorio compila sin lockfile."
          }

          Write-Host "Agent files verified."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve Cargo dependencies
        working-directory: agent
        shell: pwsh
        run: |
          cargo generate-lockfile

          if ($LASTEXITCODE -ne 0) {
            throw "Cargo dependency resolution failed."
          }

          Write-Host "Cargo dependencies resolved."

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          shared-key: moonwolf-agent-windows-x64
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Format Code
        working-directory: agent
        shell: pwsh
        run: |
          cargo fmt --all -- --check

          if ($LASTEXITCODE -ne 0) {
            throw "Rust formatting verification failed."
          }

          Write-Host "Rust formatting successful."

      - name: Determine version
        id: version
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"

            if ($tag -notmatch '^agent-v(\d+)\.(\d+)(?:\.(\d+))?$') {
              throw "Invalid Agent release tag: $tag"
            }

            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = if ($Matches[3]) { [int]$Matches[3] } else { 0 }

            $previous = ""
          }
          else {
            $releaseJson = gh release list --limit 100 --json tagName,isDraft,isPrerelease

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to retrieve GitHub releases."
            }

            $releases = @($releaseJson | ConvertFrom-Json)

            $validReleases = foreach ($release in $releases) {
              if (
                !$release.isDraft -and
                !$release.isPrerelease -and
                $release.tagName -match '^agent-v(\d+)\.(\d+)(?:\.(\d+))?$'
              ) {
                $releaseMajor = [int]$Matches[1]
                $releaseMinor = [int]$Matches[2]
                $releasePatch = if ($Matches[3]) { [int]$Matches[3] } else { 0 }

                [PSCustomObject]@{
                  Tag = $release.tagName
                  Version = [version]"$releaseMajor.$releaseMinor.$releasePatch"
                }
              }
            }

            $latest = $validReleases |
              Sort-Object Version -Descending |
              Select-Object -First 1

            if ($null -eq $latest) {
              $major = 1
              $minor = 0
              $previous = ""
            }
            else {
              $major = $latest.Version.Major
              $minor = $latest.Version.Minor + 1
              $previous = $latest.Tag

              if ($minor -ge 99) {
                $major++
                $minor = 0
              }
            }

            $patch = 0
            $tag = "agent-v$major.$minor"
          }

          $version = "$major.$minor.$patch"

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid normalized version: $version"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous_tag=$previous" >> $env:GITHUB_OUTPUT

          Write-Host "Building MoonWolf Agent v$version"

      - name: Validate Agent
        if: github.event_name == 'pull_request'
        working-directory: agent
        shell: pwsh
        env:
          MOONWOLF_AGENT_VERSION: "0.0.0"
        run: |
          cargo check --locked --target $env:BUILD_TARGET

          if ($LASTEXITCODE -ne 0) {
            throw "Cargo check failed."
          }

      - name: Build executable
        if: github.event_name != 'pull_request'
        working-directory: agent
        shell: pwsh
        env:
          MOONWOLF_AGENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build `
            --release `
            --locked `
            --target $env:BUILD_TARGET

          if ($LASTEXITCODE -ne 0) {
            throw "Rust compilation failed."
          }

          $exe = "target/$env:BUILD_TARGET/release/moonwolf-agent.exe"

          if (!(Test-Path $exe -PathType Leaf)) {
            throw "Compiled executable not found."
          }

          $vi = (Get-Item $exe).VersionInfo

          Write-Host "FileVersion:    $($vi.FileVersion)"
          Write-Host "ProductVersion: $($vi.ProductVersion)"

          if (-not "$($vi.FileVersion)".StartsWith("$env:MOONWOLF_AGENT_VERSION.")) {
            throw "Executable version does not match the expected version."
          }

          Write-Host "Rust compilation successful."

      - name: Package executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $source = "agent/target/$env:BUILD_TARGET/release/moonwolf-agent.exe"
          $destination = "dist/MoonWolf-Agent.exe"

          if (!(Test-Path $source -PathType Leaf)) {
            throw "Compiled executable not found."
          }

          Copy-Item $source $destination -Force

          $file = Get-Item $destination

          if ($file.Length -lt 500KB) {
            throw "Executable suspiciously small."
          }

          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash

          Write-Host "Executable: $($file.Length) bytes"
          Write-Host "SHA256: $hash"

          "$hash  MoonWolf-Agent.exe" |
            Out-File "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: MoonWolf-Agent
          path: |
            dist/MoonWolf-Agent.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: "Publish GitHub release"
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: MoonWolf-Agent
          path: dist

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $exe = "dist/MoonWolf-Agent.exe"
          $checksumFile = "dist/SHA256SUMS.txt"

          if (!(Test-Path $exe -PathType Leaf)) {
            throw "Executable missing."
          }

          if (!(Test-Path $checksumFile -PathType Leaf)) {
            throw "Checksum file missing."
          }

          $expected = ((Get-Content $checksumFile -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash

          if ($actual -ne $expected) {
            throw "SHA256 verification failed."
          }

          Write-Host "SHA256 verified: $actual"

      - name: Create or update GitHub Release
        if: github.event_name != 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build-windows.outputs.tag }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          PREVIOUS_TAG: ${{ needs.build-windows.outputs.previous_tag }}
        run: |
          gh release view $env:TAG_NAME --json tagName 1>$null 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            gh release upload $env:TAG_NAME `
              dist/MoonWolf-Agent.exe `
              dist/SHA256SUMS.txt `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload assets to existing release."
            }
          }
          else {
            if ($env:PREVIOUS_TAG) {
              $notes = "**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$env:PREVIOUS_TAG...$env:TAG_NAME"
            }
            else {
              $notes = "**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/commits/$env:TAG_NAME"
            }

            $notes | Set-Content -Path release-notes.md -Encoding utf8

            gh release create $env:TAG_NAME `
              dist/MoonWolf-Agent.exe `
              dist/SHA256SUMS.txt `
              --target $env:GITHUB_SHA `
              --title "MoonWolf Agent v$env:VERSION" `
              --notes-file release-notes.md

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release."
            }
          }

          Write-Host "GitHub Release operation successful."

      - name: Upload to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload $env:TAG_NAME `
            dist/MoonWolf-Agent.exe `
            dist/SHA256SUMS.txt `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload assets to published release."
          }

          Write-Host "Published release updated successfully."
