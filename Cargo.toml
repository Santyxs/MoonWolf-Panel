[package]
name = "moonwolf-panel"
version = "0.1.0"
edition = "2024"
description = "MoonWolf Panel cloud backend"
license = "MIT"

[[bin]]
name = "moonwolf-panel"
path = "server.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
socketioxide = "0.18.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
